    <circle r="22" fill="#6b4a2e"/><circle cx="-6" cy="-7" r="8" fill="#8a6440"/><circle cx="0" cy="-20" r="5" fill="#4a3220"/>
  </g>
  <!-- the forest floor -->
  <path d="M-1200 1480q300-14 600 0t600 0 600 0 1000 0V2600H-1200Z" fill="#4a3526"/>
  <path d="M-1200 1480q300-14 600 0t600 0 600 0 1000 0v20H-1200Z" fill="#6b4f36"/>
  <g fill="#3a2a1e" opacity=".7"><path d="M-1200 1560h3400v8H-1200ZM-1200 1640h3400v6H-1200Z"/></g>
  <g fill="#8a6338"><circle cx="-120" cy="1486" r="4"/><circle cx="140" cy="1488" r="3"/><circle cx="260" cy="1484" r="4"/><circle cx="700" cy="1488" r="3"/><circle cx="900" cy="1485" r="4"/><circle cx="1180" cy="1487" r="3"/></g>
  <g fill="#6b4a2e"><circle cx="300" cy="1470" r="14"/><circle cx="660" cy="1471" r="15"/></g>
  <g transform="translate(610 1468)"><circle r="18" fill="#6b4a2e"/><circle r="12" fill="#3a2516"/><g fill="#e8d7b5" stroke="#6b4a2e" stroke-width="1.5"><path d="M0 0l-4-11h8Z"/><path d="M0 0l11-4v8Z"/><path d="M0 0l4 11h-8Z"/><path d="M0 0l-11 4v-8Z"/></g></g>
