    <ellipse cx="0" cy="8" rx="34" ry="20" fill="#a8673a"/><ellipse cx="-8" cy="2" rx="20" ry="10" fill="#bd7c4b"/>
    <ellipse cx="-34" cy="0" rx="14" ry="11" fill="#a8673a"/><ellipse cx="-30" cy="-12" rx="4" ry="7" fill="#8a5230"/>
    <circle cx="-40" cy="-2" r="2" fill="#1a120c"/><circle cx="-48" cy="4" r="5" fill="#8a6440"/>
    <path d="M-20 24v12M20 24v12M8 26v10" stroke="#6b3f22" stroke-width="5" stroke-linecap="round"/>
  </g>
  <g transform="translate(840 1540)"><g fill="#e8d7b5" stroke="#6b4a2e" stroke-width="2"><path d="M0 0l-6-14h12Z"/><path d="M14 4l-2-14 10 6Z"/></g></g>
  <g transform="translate(900 1480)"><path d="M0 0v-30" stroke="#5f8c40" stroke-width="4"/><path d="M0-24q-18-10-26 0 14 8 26 0ZM0-30q16-12 26-2-14 8-26 2Z" fill="#7fa856"/><path d="M0 0q-6 30 4 56M0 10q10 16 22 20" stroke="#c9b083" stroke-width="2" fill="none"/><g transform="translate(0 52)" fill="#e8d7b5" stroke="#6b4a2e" stroke-width="2"><path d="M0 0l-6-14h12Z"/></g></g>
  <!-- a harvester, for scale -->
  <g style="--top:#4F8E92;--legs:#2a2622;--skin:#8b5a3f;--hair:#0f0c0b"><use href="#fig-front" x="230" y="1424" width="20" height="58"/></g>
  <path d="M250 1464h16l-2 14h-12Z" fill="#c9a066"/>
  <!-- height -->
  <g class="tr-ruler" font-family="var(--st-ui)" font-size="20" fill="#141210">
    <path d="M150 140V1480M138 140h24M138 1480h24M142 810h16" stroke="#141210" stroke-width="2" opacity=".45"/>
    <text x="170" y="146" opacity=".7">50 m</text>
    <text x="170" y="1486" opacity=".7" fill="#f1ead2">0</text>
  </g>
  <!-- highlights -->
  <g class="st-ring" data-on="1" transform="translate(500 270)"><circle r="250"/><circle r="250"/></g>
  <g class="st-ring" data-on="2" transform="translate(740 285)"><circle r="90"/><circle r="90"/></g>
  <g class="st-ring" data-on="3" transform="translate(566 930)"><circle r="60"/><circle r="60"/></g>
  <g class="st-ring" data-on="4" transform="translate(790 1475)"><circle r="96"/><circle r="96"/></g>
</g>
</svg>
