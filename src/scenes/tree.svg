    <g transform="translate(800 312) rotate(14)"><ellipse cx="-6" cy="-9" rx="8" ry="5" fill="#fff" opacity=".7"/><ellipse cx="6" cy="-9" rx="8" ry="5" fill="#fff" opacity=".7"/><ellipse rx="10" ry="6" fill="#2b2418"/><rect x="-3" y="-6" width="5" height="12" fill="#e3b23c"/></g>
    <g transform="translate(748 222) rotate(-40)"><ellipse cx="-5" cy="-8" rx="7" ry="5" fill="#fff" opacity=".7"/><ellipse cx="5" cy="-8" rx="7" ry="5" fill="#fff" opacity=".7"/><ellipse rx="9" ry="6" fill="#2b2418"/><rect x="-2" y="-6" width="4" height="12" fill="#e3b23c"/></g>
  </g>
