    <g fill="#6f9a4a"><circle cx="360" cy="270" r="96"/><circle cx="620" cy="260" r="104"/><circle cx="490" cy="200" r="110"/><circle cx="280" cy="350" r="70"/><circle cx="720" cy="350" r="74"/><circle cx="500" cy="320" r="110"/></g>
    <g fill="#86ad55"><circle cx="420" cy="190" r="66"/><circle cx="580" cy="170" r="60"/><circle cx="330" cy="250" r="50"/><circle cx="670" cy="240" r="54"/></g>
