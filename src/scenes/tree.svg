<svg class="st-art" viewBox="0 0 1000 1600" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">
<defs>
  <linearGradient id="tr-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b9d5cf"/><stop offset=".7" stop-color="#e7ecd7"/><stop offset="1" stop-color="#f1ead2"/></linearGradient>
  <radialGradient id="tr-sun"><stop offset="0" stop-color="#fff7dd" stop-opacity=".9"/><stop offset="1" stop-color="#fff7dd" stop-opacity="0"/></radialGradient>
  <linearGradient id="tr-under" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f4f2a"/><stop offset="1" stop-color="#1c2f19"/></linearGradient>
  <linearGradient id="tr-shaft" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6f0c8" stop-opacity=".22"/><stop offset="1" stop-color="#f6f0c8" stop-opacity="0"/></linearGradient>
  <linearGradient id="tr-bark" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a69482"/><stop offset=".45" stop-color="#8c7a68"/><stop offset="1" stop-color="#5f5144"/></linearGradient>
</defs>
<g class="cam">
  <rect x="-1200" y="-900" width="3400" height="1700" fill="url(#tr-sky)"/>
  <circle cx="780" cy="150" r="220" fill="url(#tr-sun)"/>
  <!-- far and middle canopy -->
  <path d="M-1200 640q60-60 120-10t120-20 130 10 110-30 120 20 120-10 140 20 110-30 130 10 120-20 110 30 130-20 120 10 140-10 110 20 130-30 120 10 110 20V1000H-1200Z" fill="#9db69a"/>
  <path d="M-1200 720q80-70 160-10t140-30 150 20 130-40 150 30 140-20 160 30 120-40 150 20 140-20 130 40 150-30 140 10 160-10 130 30V1100H-1200Z" fill="#6b9459"/>
  <path d="M-1200 800q90-60 170-10t150-20 160 10 140-30 160 20 150-10 170 20 130-30 160 10 150-20 140 30 160-20 150 10V1200H-1200Z" fill="#4c7a41"/>
