  <rect x="-1200" y="860" width="3400" height="640" fill="url(#tr-under)"/>
  <g fill="#1a2c17"><rect x="-260" y="840" width="26" height="640"/><rect x="60" y="860" width="18" height="620"/><rect x="180" y="880" width="14" height="600"/><rect x="820" y="860" width="22" height="620"/><rect x="1080" y="840" width="30" height="640"/><rect x="1320" y="870" width="16" height="610"/><rect x="-560" y="860" width="20" height="620"/></g>
  <polygon points="620,860 700,860 900,1480 760,1480" fill="url(#tr-shaft)"/>
  <polygon points="140,860 190,860 300,1480 210,1480" fill="url(#tr-shaft)"/>
  <g fill="#2f5a2a"><path d="M-80 1480q40-80 90-60-40 10-50 60Z"/><path d="M880 1480q30-110 110-90-60 20-70 90Z"/><path d="M120 1480q-20-90 60-110-30 40-20 110Z"/><path d="M1120 1480q20-90 90-90-50 30-50 90Z"/></g>
  <g fill="#3f6a38"><ellipse cx="40" cy="1460" rx="70" ry="22"/><ellipse cx="960" cy="1465" rx="90" ry="24"/><ellipse cx="-300" cy="1462" rx="80" ry="22"/><ellipse cx="1260" cy="1462" rx="80" ry="22"/></g>

