  <path d="M352 1490q60-30 106-80l12-990h60l12 990q46 50 106 80Z" fill="url(#tr-bark)"/>
  <path d="M380 1490q50-14 84-60M620 1490q-50-14-84-60" stroke="#5f5144" stroke-width="6" fill="none"/>
  <g stroke="#6f604f" stroke-width="3" opacity=".6"><path d="M486 1420V460M512 1400V500M500 1300V700"/></g>
  <path d="M500 470q-60-60-150-90M500 450q40-70 140-110M500 430q-10-80-20-140M500 460q90-30 170-30" stroke="#7a6858" stroke-width="16" fill="none" stroke-linecap="round"/>
