<svg class="st-sprite" width="0" height="0" aria-hidden="true" focusable="false">
<defs>
  <!-- People are drawn without faces on purpose: no real person is shown, and no one could be recognised. -->

  <!-- Standing, seen from the back (head covered by hair). 140 x 400. -->
  <symbol id="fig-back" viewBox="0 0 140 400">
    <path d="M47 246 43 388q0 8 8 8h13l4-134Z" fill="var(--legs,#1a1715)"/>
    <path d="M93 246 97 388q0 8-8 8H76l-4-134Z" fill="var(--legs,#1a1715)"/>
    <path d="M36 108q34-14 68 0l9 150q-43 12-86 0Z" fill="var(--top,#4f8e92)"/>
    <path d="M37 112q-15 4-17 34l-5 92q0 10 10 9l7-1 7-86Z" fill="var(--top,#4f8e92)"/>
    <path d="M103 112q15 4 17 34l5 92q0 10-10 9l-7-1-7-86Z" fill="var(--top,#4f8e92)"/>
    <path d="M18 240q-2 12 6 13t9-11Zm104 0q2 12-6 13t-9-11Z" fill="var(--skin,#a87458)"/>
    <rect x="61" y="80" width="18" height="24" rx="7" fill="var(--skin,#a87458)"/>
    <ellipse cx="70" cy="54" rx="27" ry="31" fill="var(--hair,#0f0c0b)"/>
  </symbol>

  <!-- Ana from the back: same body, hair in a bun, cardigan in her colour. -->
  <symbol id="fig-ana-back" viewBox="0 0 140 400">
    <use href="#fig-back" width="140" height="400"/>
    <circle cx="70" cy="22" r="14" fill="var(--hair,#0f0c0b)"/>
  </symbol>

  <!-- Standing, front, faceless. 140 x 400. -->
  <symbol id="fig-front" viewBox="0 0 140 400">
    <path d="M47 246 43 388q0 8 8 8h13l4-134Z" fill="var(--legs,#1a1715)"/>
    <path d="M93 246 97 388q0 8-8 8H76l-4-134Z" fill="var(--legs,#1a1715)"/>
    <path d="M36 108q34-14 68 0l9 150q-43 12-86 0Z" fill="var(--top,#4f8e92)"/>
    <path d="M58 100h24l-12 24Z" fill="var(--skin,#a87458)"/>
    <path d="M37 112q-15 4-17 34l-5 92q0 10 10 9l7-1 7-86Z" fill="var(--top,#4f8e92)"/>
    <path d="M103 112q15 4 17 34l5 92q0 10-10 9l-7-1-7-86Z" fill="var(--top,#4f8e92)"/>
    <path d="M18 240q-2 12 6 13t9-11Zm104 0q2 12-6 13t-9-11Z" fill="var(--skin,#a87458)"/>
    <rect x="61" y="80" width="18" height="24" rx="7" fill="var(--skin,#a87458)"/>
    <ellipse cx="70" cy="54" rx="26" ry="30" fill="var(--skin,#a87458)"/>
    <path d="M43 54q0-34 27-34t27 34q-6-18-27-18T43 54Z" fill="var(--hair,#0f0c0b)"/>
  </symbol>

  <!-- Upper body only, front, for people behind a counter. 140 x 200. -->
  <symbol id="fig-bust" viewBox="0 0 140 200">
    <path d="M30 108q40-16 80 0l12 92H18Z" fill="var(--top,#4f8e92)"/>
    <path d="M50 112h40l-6 88H56Z" fill="var(--apron,transparent)"/>
    <path d="M58 100h24l-12 22Z" fill="var(--skin,#a87458)"/>
    <rect x="61" y="80" width="18" height="24" rx="7" fill="var(--skin,#a87458)"/>
    <ellipse cx="70" cy="54" rx="26" ry="30" fill="var(--skin,#a87458)"/>
    <path d="M43 54q0-34 27-34t27 34q-6-18-27-18T43 54Z" fill="var(--hair,#0f0c0b)"/>
  </symbol>

  <!-- Seated, side view facing left, from the waist up (a table hides the rest). 200 x 210. -->
  <symbol id="fig-seat" viewBox="0 0 200 210">
    <path d="M70 92q30-12 60 0l12 118H62Z" fill="var(--top,#4f8e92)"/>
    <rect x="94" y="74" width="18" height="24" rx="7" fill="var(--skin,#a87458)"/>
    <ellipse cx="102" cy="50" rx="26" ry="30" fill="var(--skin,#a87458)"/>
    <path d="M78 50q2-32 30-32 28 2 26 36-7-16-26-16-18 0-30 12Z" fill="var(--hair,#0f0c0b)"/>
    <path d="M122 38q16 22 6 50h-12q8-24 0-40Z" fill="var(--hair,#0f0c0b)"/>
    <circle cx="128" cy="26" r="13" fill="var(--bun,transparent)"/>
  </symbol>

  <!-- A forearm resting on a table, pointing left. Drawn over the table top. 120 x 30. -->
  <symbol id="fig-forearm" viewBox="0 0 120 30">
    <path d="M120 4 26 8q-10 0-12 8t10 9l96-2Z" fill="var(--top,#4f8e92)"/>
    <ellipse cx="14" cy="16" rx="12" ry="8" fill="var(--skin,#a87458)"/>
  </symbol>

  <!-- A bicycle, 120 x 70, for the canal scenes. -->
  <symbol id="bike" viewBox="0 0 120 70">
    <g fill="none" stroke="var(--bike,#0c0a09)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="24" cy="46" r="20"/><circle cx="96" cy="46" r="20"/>
      <path d="M24 46 48 20h36l12 26M48 20l18 26h-42M66 46l18-26M44 12h12M84 20l-4-10h10"/>
    </g>
  </symbol>

  <!-- Paper grain for daylight scenes. -->
  <filter id="st-soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
  <filter id="st-softer" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
  <radialGradient id="st-vignette" cx="50%" cy="48%" r="70%">
    <stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".62"/>
  </radialGradient>
  <linearGradient id="st-cone" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffc888" stop-opacity=".42"/><stop offset="1" stop-color="#ffb466" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="st-warm"><stop offset="0" stop-color="#ffb466" stop-opacity=".55"/><stop offset="1" stop-color="#ffb466" stop-opacity="0"/></radialGradient>
  <radialGradient id="st-cold"><stop offset="0" stop-color="#bfe3e0" stop-opacity=".42"/><stop offset="1" stop-color="#bfe3e0" stop-opacity="0"/></radialGradient>
</defs>
</svg>
